name: Extract ZIP

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "Nama ZIP"
        required: true
        default: "kagunex-baileys-1.8.3-pairing-stable.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Check ZIP
        run: |
          if [ ! -f "${{ inputs.zip_file }}" ]; then
            echo "❌ ZIP tidak ditemukan"
            exit 1
          fi

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q "${{ inputs.zip_file }}" -d extracted

          # Jika ZIP memiliki satu folder root,
          # gunakan isi folder tersebut.
          ROOT="extracted"

          COUNT=$(find extracted -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILES=$(find extracted -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$COUNT" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -1)
          fi

          cp -a "$ROOT"/. .

          rm -rf extracted

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: extract ZIP" || echo "Nothing to commit"
          git push
