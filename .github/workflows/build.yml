name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "❌ ZIP tidak ditemukan."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"
          echo "✅ ZIP ditemukan: $ZIP"

      - name: Validate ZIP
        run: |
          set -e
          unzip -t "$ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP_FILE" -d extracted

          # Jangan mengganti workflow GitHub yang sedang menjalankan Action
          rm -rf extracted/.github/workflows

          shopt -s dotglob nullglob

          cp -a extracted/. ./

          rm -rf extracted

          echo "✅ ZIP berhasil diekstrak."

      - name: Remove ZIP
        run: |
          rm -f "$ZIP_FILE"

      - name: Commit & Push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Extract ZIP"

          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "✅ Extract dan push berhasil."
