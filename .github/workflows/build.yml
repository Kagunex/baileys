name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP to root
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file tidak ditemukan."
            exit 1
          fi

          mkdir -p /tmp/extract

          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d /tmp/extract

          rm -f "$ZIP_FILE"

          # Jika ZIP hanya memiliki 1 folder utama,
          # ambil ISINYA langsung ke root repository.
          ITEMS=(/tmp/extract/*)

          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            cp -a "${ITEMS[0]}"/. .
          else
            cp -a /tmp/extract/. .
          fi

          rm -rf /tmp/extract

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Extract ZIP to repository root"
          git push
