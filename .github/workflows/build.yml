name: Delete Repository Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Delete All Repository Files
        run: |
          echo "Menghapus seluruh file repository..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          if [ -d ".github/workflows" ]; then
            find .github/workflows \
              -type f \
              ! -name "delete.yml" \
              -delete
          fi

          find .github -type d -empty -delete 2>/dev/null || true

          echo "File yang tersisa:"
          find . -maxdepth 3 -not -path './.git/*' -print

      - name: Commit Deletion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada file yang perlu dihapus."
            exit 0
          fi

          git commit -m "Delete repository files"
          git push
