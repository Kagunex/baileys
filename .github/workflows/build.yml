name: Delete Files or Folders

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "File/folder yang mau dihapus, pisahkan dengan koma"
        required: true
        type: string
        default: "old-file.txt,old-folder"

jobs:
  delete:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete selected paths
        shell: bash
        run: |
          set -e

          IFS=',' read -ra ITEMS <<< "${{ inputs.paths }}"

          for item in "${ITEMS[@]}"; do
            item="$(echo "$item" | xargs)"

            if [ -z "$item" ]; then
              continue
            fi

            # Jangan izinkan workflow menghapus workflow build utama
            if [ "$item" = ".github/workflows/build.yml" ]; then
              echo "ERROR: build.yml tidak boleh dihapus."
              exit 1
            fi

            if [ "$item" = ".github/workflows" ]; then
              echo "ERROR: folder workflows tidak boleh dihapus."
              exit 1
            fi

            echo "Deleting: $item"

            if [ -e "$item" ]; then
              rm -rf -- "$item"
            else
              echo "Tidak ditemukan: $item"
            fi
          done

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Delete selected files/folders"
          git push
