name: Build & Verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Assert dist outputs
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          ls -la dist/index.*

      - name: CommonJS require test
        run: |
          node -e "const b=require('./dist/index.cjs'); console.log(typeof b.default); console.log(typeof b.useMultiFileAuthState); if(typeof b.default!=='function'||typeof b.useMultiFileAuthState!=='function') process.exit(1)"

      - name: ESM import test
        run: |
          node --input-type=module -e "import b from './dist/index.js'; import { useMultiFileAuthState } from './dist/index.js'; console.log(typeof b); console.log(typeof useMultiFileAuthState); if(typeof b!=='function'||typeof useMultiFileAuthState!=='function') process.exit(1)"

      - name: Package verify script
        run: npm run verify

      - name: Unit tests
        run: npm test

      - name: npm pack dry-run
        run: npm pack --dry-run
