name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP tidak ditemukan."
            exit 1
          fi

          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          ZIP="${{ steps.zip.outputs.path }}"

          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted

          unzip -q "$ZIP" -d /tmp/extracted

          ROOTS=$(find /tmp/extracted -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ROOTS" -eq 1 ] && [ -d "$(find /tmp/extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then
            ROOT=$(find /tmp/extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
            cp -a "$ROOT"/. .
          else
            cp -a /tmp/extracted/. .
          fi

      - name: Remove ZIP
        run: |
          rm -f "${{ steps.zip.outputs.path }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Extract ZIP"
          git push origin HEAD:main
