name: Extract ZIP

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "Nama file ZIP di repository"
        required: true
        default: "project.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          if [ ! -f "${{ inputs.zip_file }}" ]; then
            echo "ZIP tidak ditemukan: ${{ inputs.zip_file }}"
            exit 1
          fi

      - name: Extract ZIP
        run: |
          mkdir -p .extract

          unzip -o "${{ inputs.zip_file }}" -d .extract

          shopt -s dotglob
          cp -a .extract/* .

          rm -rf .extract
          rm -f "${{ inputs.zip_file }}"

      - name: Show Structure
        run: |
          echo "=== Repository Structure ==="
          find . -maxdepth 3 -type f \
            -not -path './.git/*' \
            | sort

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Extract ZIP"
          git push
