name: Extract ZIP To Repository

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          rm -rf /tmp/extract
          mkdir -p /tmp/extract

          unzip -q "${{ steps.zip.outputs.zip }}" -d /tmp/extract

          ROOT_COUNT=$(find /tmp/extract -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ROOT_COUNT" -eq 1 ] && [ -d "$(find /tmp/extract -mindepth 1 -maxdepth 1 -type d)" ]; then
            SOURCE_DIR=$(find /tmp/extract -mindepth 1 -maxdepth 1 -type d)
            cp -a "$SOURCE_DIR"/. .
          else
            cp -a /tmp/extract/. .
          fi

          rm -f "${{ steps.zip.outputs.zip }}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: extract source"
          git push
