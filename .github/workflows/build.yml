name: Delete Everything

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete All Repository Files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " DELETE ALL REPOSITORY CONTENT"
          echo "======================================"

          # Hapus seluruh isi repository
          # tetapi pertahankan folder workflow agar
          # workflow yang sedang berjalan tidak hilang.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf -- {} +

          # Hapus isi .github kecuali workflows
          if [ -d ".github" ]; then
            find .github -mindepth 1 -maxdepth 1 \
              ! -name 'workflows' \
              -exec rm -rf -- {} +
          fi

          echo ""
          echo "Isi repository setelah penghapusan:"
          find . -maxdepth 3 -not -path './.git*' -print

      - name: Commit Changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Delete all repository files"
          git push

          echo "======================================"
          echo " Repository content deleted."
          echo "======================================"
