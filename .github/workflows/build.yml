name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "❌ ZIP tidak ditemukan."
            ls -la
            exit 1
          fi

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"
          echo "✅ ZIP: $ZIP"

      - name: Test ZIP
        run: |
          set -e
          unzip -t "$ZIP_FILE"

      - name: Extract
        run: |
          set -e

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          shopt -s dotglob nullglob

          cp -a extracted/. ./

          rm -rf extracted

          echo "✅ Extract selesai."

      - name: Remove ZIP
        run: |
          rm -f "$ZIP_FILE"

      - name: Commit
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Extract ZIP"

      - name: Push
        env:
          GH_PAT: ${{ secrets.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 }}
        run: |
          set -e

          if [ -z "$GH_PAT" ]; then
            echo "❌ Secret GH_PAT belum dibuat."
            exit 1
          fi

          git remote set-url origin \
            "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"

          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "✅ Selesai."
