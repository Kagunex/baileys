name: Extract ZIP

on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Nama file ZIP di root repository"
        required: true
        type: string
        default: "kagunex-baileys-1.8.3.zip"

      delete_zip:
        description: "Hapus ZIP setelah berhasil diekstrak?"
        required: true
        type: boolean
        default: true

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ZIP
        shell: bash
        run: |
          set -e

          ZIP="${{ inputs.zip }}"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan: $ZIP"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"

      - name: Extract ZIP safely
        shell: bash
        run: |
          set -e

          ZIP="${{ inputs.zip }}"
          TMP_DIR="$(mktemp -d)"

          echo "Extracting $ZIP..."

          unzip -q "$ZIP" -d "$TMP_DIR"

          # Kalau ZIP memiliki satu folder utama, masuk ke folder tersebut
          shopt -s dotglob nullglob
          ITEMS=("$TMP_DIR"/*)

          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            SOURCE="${ITEMS[0]}"
          else
            SOURCE="$TMP_DIR"
          fi

          echo "Source: $SOURCE"

          # Copy semua isi ZIP kecuali workflow build.yml
          # build.yml repository TIDAK akan ditimpa.
          rsync -a \
            --exclude='.github/workflows/build.yml' \
            "$SOURCE/" "./"

          rm -rf "$TMP_DIR"

      - name: Verify protected workflow
        shell: bash
        run: |
          set -e

          if [ ! -f ".github/workflows/build.yml" ]; then
            echo "ERROR: build.yml hilang!"
            exit 1
          fi

          echo "build.yml tetap aman."

      - name: Remove ZIP
        if: ${{ inputs.delete_zip }}
        shell: bash
        run: |
          rm -f -- "${{ inputs.zip }}"

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Extract KaguneX Baileys ZIP"
          git push
